[project]
name = "cv-agent"
version = "0.1.0"
description = "Reproducible Code-RAG and multi-expert vulnerability-agent experiments"
requires-python = ">=3.12"
dependencies = [
  "langgraph",
  "pydantic>=2",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-go>=0.25,<0.26",
  "tree-sitter-java>=0.23.5,<0.24",
  "tree-sitter-javascript>=0.25,<0.26",
  "tree-sitter-typescript>=0.23.2,<0.24",
]

[project.scripts]
cv-agent = "cv_agent.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.workspace]
members = []
